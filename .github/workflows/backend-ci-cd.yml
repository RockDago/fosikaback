name: Backend CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Laravel CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, curl, zip, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: PHP syntax check
        run: |
          find app config database routes tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Laravel package discovery
        run: php artisan package:discover --ansi

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2244
          script_stop: true
          script: |
            set -e

            cd /var/www/fosikaback

            php artisan down || true

            git fetch origin
            git pull --ff-only origin "${{ github.ref_name }}"

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            php artisan storage:link || true

            chown -R www-data:www-data storage bootstrap/cache || true
            find storage -type d -exec chmod 775 {} \; || true
            find storage -type f -exec chmod 664 {} \; || true

            php artisan up
