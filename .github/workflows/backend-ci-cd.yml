name: Backend CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Laravel CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, curl, zip, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=base64:3RgxVt5yJ32/AXnB4Isx5V3N2vB0ok2WBmmUAcM4f64=', file_get_contents('.env')));"
          php artisan config:clear --ansi

      - name: PHP syntax check
        run: |
          find app config database routes tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Laravel package discovery
        run: php artisan package:discover --ansi

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2244
          envs: SUDO_PASSWORD
          script_stop: true
          script: |
            set -e

            cd /var/www/fosikaback

            run_as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              elif command -v sudo >/dev/null 2>&1; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
              else
                "$@"
              fi
            }

            fix_laravel_permissions() {
              run_as_root mkdir -p \
                storage/app/public/reports \
                storage/app/public/uploads \
                storage/logs \
                storage/framework/cache \
                storage/framework/sessions \
                storage/framework/views \
                bootstrap/cache \
                public/uploads/reports
              run_as_root chown -R "$USER":www-data storage bootstrap/cache public/uploads
              run_as_root chmod -R ug+rwX storage bootstrap/cache public/uploads
            }

            relink_public_storage() {
              if [ -L public/storage ] || [ -f public/storage ]; then
                run_as_root rm -f public/storage
              elif [ -e public/storage ]; then
                run_as_root mkdir -p "$backup_dir"
                run_as_root mv public/storage "$backup_dir/public-storage"
                echo "Backed up existing public/storage directory: public/storage -> $backup_dir/public-storage"
              fi

              php artisan storage:link --force
              run_as_root chown -h www-data:www-data public/storage || true
            }

            fix_laravel_permissions

            run_as_root php artisan down || true

            git fetch origin
            backup_dir=".deploy-backups/$(date +%Y%m%d-%H%M%S)"
            comm -12 \
              <(git ls-files --others --exclude-standard | sort) \
              <(git ls-tree -r --name-only "origin/${{ github.ref_name }}" | sort) \
              | while read -r file; do
                  if [ -n "$file" ] && [ -f "$file" ]; then
                    run_as_root mkdir -p "$backup_dir/$(dirname "$file")"
                    run_as_root mv "$file" "$backup_dir/$file"
                    echo "Backed up untracked deploy-conflict file: $file -> $backup_dir/$file"
                  fi
                done

            git pull --ff-only origin "${{ github.ref_name }}"

            fix_laravel_permissions

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            relink_public_storage

            run_as_root chown -R www-data:www-data storage bootstrap/cache public/uploads
            run_as_root find storage bootstrap/cache public/uploads -type d -exec chmod 775 {} \;
            run_as_root find storage bootstrap/cache public/uploads -type f -exec chmod 664 {} \;

            run_as_root php artisan up
